version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: calculator-server
    ports:
      - "8080:8080"
    networks:
      - calculator-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: calculator-client
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - calculator-network

networks:
  calculator-network:
    driver: bridge
